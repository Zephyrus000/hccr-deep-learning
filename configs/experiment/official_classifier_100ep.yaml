experiment_id: official-hwdb1_0-1_1-baselines-100ep-fp32
manifest: data/processed/hwdb1_0-1_1_official_five_splits/manifest.csv
output_dir: experiments/official_classifier_100ep_fp32
seeds: [7, 17, 29]
profile_devices: []
full_class_num_classes: 3755
base_args:
  num_classes: 3755
  require_official_data: true
  evaluation_policy: validation_only
  checkpoint_selection: best_validation
  image_size: 96
  embedding_dim: 320
  classifier_structure: dense
  classification_head: cosface
  logit_scale: 32.0
  angular_margin: 0.1
  margin_warmup_ratio: 0.1
  epochs: 100
  batch_size: 256
  reference_batch_size: 256
  optimizer_step_policy: configured_epochs
  learning_rate_scaling: none
  learning_rate: 0.0001
  weight_decay: 0.0001
  lr_warmup_ratio: 0.05
  scheduler: cosine
  scheduler_min_lr: 0.000001
  early_stopping_patience: 0
  reproducibility_mode: strict
  device: cuda
  precision: float32
  augmentation_backend: gpu
  training_cache: cuda
  training_cache_max_gib: 20.0
  training_cache_reserve_gib: 4.0
  dataset_backend: lmdb
  num_workers: 10
  train_rotation_degrees: 7.0
  train_translate_ratio: 0.05
  train_blur_probability: 0.0
variants:
  - name: efficient_hccr_cosface
    args:
      model: efficient_hccr
      width: 80
      stage_depths: [2, 3, 3]
      backbone_output_channels: 320
      reparameterize_depthwise: false
  - name: efficient_hccr_arcface
    args:
      model: efficient_hccr
      width: 80
      stage_depths: [2, 3, 3]
      backbone_output_channels: 320
      reparameterize_depthwise: false
      classification_head: arcface
      angular_margin: 0.2
  - name: efficient_hccr_linear_ce
    args:
      model: efficient_hccr
      width: 80
      stage_depths: [2, 3, 3]
      backbone_output_channels: 320
      reparameterize_depthwise: false
      classification_head: softmax
      angular_margin: 0.0
      margin_warmup_ratio: 0.0
  - name: efficient_hccr_normalized_softmax
    args:
      model: efficient_hccr
      width: 80
      stage_depths: [2, 3, 3]
      backbone_output_channels: 320
      reparameterize_depthwise: false
      classification_head: normalized_softmax
      angular_margin: 0.0
      margin_warmup_ratio: 0.0
  - name: resnet18_cosface
    args: {model: resnet18}
  - name: mobilenet_v3_small_cosface
    args: {model: mobilenet_v3_small}
  - name: shufflenet_v2_x1_0_cosface
    args: {model: shufflenet_v2_x1_0}
  - name: efficientnet_b0_cosface
    args: {model: efficientnet_b0}
  - name: mobilenetv4_conv_small_cosface
    args: {model: mobilenetv4_conv_small}
  - name: repvit_m0_9_cosface
    args: {model: repvit_m0_9}
