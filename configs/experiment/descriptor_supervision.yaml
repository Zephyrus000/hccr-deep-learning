# Dedicated schema for scripts/train_descriptor_supervision.py, not hccr experiment.
# All variants fine-tune the same CNN and CosFace. No training starts on import.
common:
  source_run: artifacts/downloads/vastai-20261026/57418784/primary/repo/experiments/classifier-study/final-queue/jobs/c5ce33ee34cd461a931eddb2b324e54e7df173ee51e7751a2001c63ae0e90bb5/runs/20261024T014003Z-57767b41
  manifest: data/processed/hwdb1_0-1_1_official_five_splits/manifest.csv
  epochs: 20
  batch_size: 128
  learning_rate: 0.0001
  min_learning_rate: 0.000001
  weight_decay: 0.0001
  seed: 7
  device: cuda
  precision: source
  cpu_threads: 4
  num_workers: 2
  augmentation: none
  auxiliary_warmup_epochs: 2
  # Provisional weights. Tune on validation with the same budget per method.
  hog_weight: 0.1
  tda_weight: 0.1
variants:
  none:
    output_dir: experiments/descriptor-supervision/seed7/cnn-only
  hog:
    output_dir: experiments/descriptor-supervision/seed7/hog
  tda:
    output_dir: experiments/descriptor-supervision/seed7/tda
    tda_cache: artifacts/descriptor-supervision/image-tda
  both:
    output_dir: experiments/descriptor-supervision/seed7/both
    tda_cache: artifacts/descriptor-supervision/image-tda
