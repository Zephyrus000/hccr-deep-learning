# Keep data, seeds, resolution, and hardware fixed across every variant.
experiment_id: architecture-ablations
manifest: data/processed/casia_hwdb/manifest.csv
output_dir: experiments
seeds: [7, 17, 29]
profile_devices: [cpu]
full_class_num_classes: 7186

base_args:
  evaluation_policy: validation_only
  reproducibility_mode: strict
  max_classes: 1000
  image_size: 64
  batch_size: 64
  epochs: 10

variants:
  - name: narrow
    args:
      width: 24
      stage_depths: [1, 2, 2]
  - name: baseline
    args:
      width: 32
      stage_depths: [1, 2, 2]
  - name: wider
    args:
      width: 48
      stage_depths: [1, 2, 2]
  - name: deeper
    args:
      width: 32
      stage_depths: [2, 3, 3]
