experiment_id: mscs-asa-vs-efficient-hccr-fp32
manifest: data/processed/hwdb1_0-1_1_official_five_splits/manifest.csv
output_dir: experiments/domain-specific-hccr
seeds: [7, 17, 29]
profile_devices: []
full_class_num_classes: 3755
base_args:
  num_classes: 3755
  require_official_data: true
  evaluation_policy: final_test
  checkpoint_selection: best_validation
  image_size: 96
  classifier_structure: dense
  epochs: 100
  batch_size: 128
  reference_batch_size: 128
  optimizer_step_policy: configured_epochs
  learning_rate_scaling: none
  learning_rate: 0.0001
  weight_decay: 0.0001
  lr_warmup_ratio: 0.05
  scheduler: cosine
  scheduler_min_lr: 0.000001
  early_stopping_patience: 0
  reproducibility_mode: strict
  device: cuda
  precision: float32
  augmentation_backend: gpu
  training_cache: cpu
  training_cache_max_gib: 20.0
  training_cache_reserve_gib: 4.0
  dataset_backend: lmdb
  num_workers: 10
  train_rotation_degrees: 7.0
  train_translate_ratio: 0.05
  train_blur_probability: 0.0
variants:
  - name: efficient_hccr_cosface
    args:
      model: efficient_hccr
      width: 80
      stage_depths: [2, 3, 3]
      stem_stride: 2
      backbone_output_channels: 320
      embedding_dim: 320
      reparameterize_depthwise: false
      classification_head: cosface
      logit_scale: 32.0
      angular_margin: 0.1
      margin_warmup_ratio: 0.1
  - name: mscs_asa_softmax
    args:
      model: mscs_asa
      classification_head: softmax
