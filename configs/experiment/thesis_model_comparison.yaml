# Controlled full-class jobs for the lecturer's model comparison table.
# Every job uses the same manifest, split, image size, optimizer budget,
# augmentation/preprocessing defaults, seed, final held-out test, and CUDA
# profiling protocol. Run sequentially with scripts/run_experiments.py.
#
# The proposed control is the final New EfficientHCCRNet candidate:
# width 80 -> late 1x1 expansion to 320 -> embedding 256, with multi-branch
# depthwise reparameterization and CosFace. It retains the architecture and
# optimiser settings of the historical 96.33% model where they remain useful,
# then adds the selected reparameterized deploy path and the capped embedding.
# The two proposed ablations change exactly one feature relative to this control.
experiment_id: thesis-model-comparison
manifest: data/processed/casia_hwdb/manifest.csv
output_dir: experiments
seeds: [7]
profile_devices: [cuda]
full_class_num_classes: 7186

base_args:
  model: efficient_hccr
  device: cuda
  dataset_backend: lmdb
  evaluation_policy: final_test
  reproducibility_mode: strict
  num_classes: 7186
  image_size: 96
  # One RTX 4090 is available for this run. LMDB keeps 16 workers fed without
  # retaining raw image files in the training path.
  batch_size: 256
  reference_batch_size: 256
  optimizer_step_policy: configured_epochs
  learning_rate_scaling: none
  epochs: 20
  learning_rate: 3.0e-4
  lr_warmup_ratio: 0.0
  weight_decay: 1.0e-4
  width: 80
  stage_depths: [2, 3, 3]
  stem_stride: 2
  backbone_output_channels: 320
  embedding_dim: 256
  reparameterize_depthwise: true
  classification_head: cosface
  logit_scale: 32.0
  angular_margin: 0.1
  margin_warmup_ratio: 0.2
  dropout: 0.1
  label_smoothing: 0.0
  scheduler: cosine
  scheduler_min_lr: 1.0e-6
  scheduler_patience: 3
  early_stopping_patience: 0
  num_workers: 16
  dataloader_start_method: auto
  prefetch_factor: 1
  persistent_workers: true
  worker_timeout_seconds: 120.0
  benchmark_warmup_iterations: 20
  benchmark_iterations: 200
  benchmark_repetitions: 5

variants:
  # New proposed control. Its arguments are entirely in base_args so that the
  # two ablations below inherit every architectural and training setting.
  - name: new_efficient_hccr
    args: {}

  - name: resnet18
    args:
      model: resnet18
      classification_head: softmax

  - name: mobilenet_v3_small
    args:
      model: mobilenet_v3_small
      classification_head: softmax

  - name: efficient_hccr_without_reparameterization
    args:
      reparameterize_depthwise: false

  - name: efficient_hccr_without_cosface
    args:
      classification_head: softmax
