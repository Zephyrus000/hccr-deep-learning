# Controlled full-class comparison: 8 architectures x 3 seeds = 24 runs.
# Every job shares the same manifest, preprocessing/augmentation, CosFace head,
# optimizer budget, BF16 DDP setup, and eager/optimized inference protocol.
experiment_id: thesis-model-comparison-cosface-a100
manifest: data/processed/casia_hwdb/manifest.csv
output_dir: experiments
seeds: [7, 17, 29]
profile_devices: [cuda]
full_class_num_classes: 7186

# Fail fast on the real run if the requested two-GPU A100 node is not visible.
# Dry-run only validates and materializes the 24 commands, so it remains usable
# on a development machine without CUDA.
torchrun_nproc_per_node: 2
required_cuda_device_count: 2
required_cuda_device_name: A100-SXM4-40GB

base_args:
  model: efficient_hccr
  device: cuda
  precision: bfloat16
  distributed: true
  dataset_backend: lmdb
  evaluation_policy: final_test
  reproducibility_mode: strict
  num_classes: 7186
  image_size: 96

  # batch_size and num_workers are per GPU/rank: 256 x 2 = Global Batch 512,
  # with 12 DataLoader workers on each GPU.
  batch_size: 256
  reference_batch_size: 256
  optimizer_step_policy: configured_epochs
  learning_rate_scaling: none
  epochs: 20
  learning_rate: 3.0e-4
  lr_warmup_ratio: 0.0
  weight_decay: 1.0e-4

  # Shared settings recovered from run 20260822T224249Z-c43e969f.
  width: 80
  stage_depths: [2, 3, 3]
  stem_stride: 2
  classification_head: cosface
  logit_scale: 32.0
  angular_margin: 0.1
  margin_warmup_ratio: 0.2
  dropout: 0.1
  label_smoothing: 0.0
  scheduler: cosine
  scheduler_min_lr: 1.0e-6
  scheduler_patience: 3
  early_stopping_patience: 0

  num_workers: 12
  dataloader_start_method: auto
  prefetch_factor: 1
  persistent_workers: true
  worker_timeout_seconds: 120.0

  # profile_model runs identical batch 1/8/32 eager and optimized benchmarks.
  # Both paths use model.eval() inside torch.inference_mode().
  benchmark_warmup_iterations: 20
  benchmark_iterations: 200
  benchmark_repetitions: 5

variants:
  - name: resnet18_cosface
    args:
      model: resnet18

  - name: mobilenet_v3_small_cosface
    args:
      model: mobilenet_v3_small

  - name: efficientnet_b0_cosface
    args:
      model: efficientnet_b0

  - name: shufflenet_v2_x1_0_cosface
    args:
      model: shufflenet_v2_x1_0

  # Architecture from 20260822T224249Z-c43e969f: single branch and native
  # width*4 = 320 backbone/embedding dimensions. Training/runtime settings are
  # intentionally replaced by the common BF16 two-A100 protocol above.
  - name: efficient_hccr_20260822T224249Z_c43e969f
    args:
      reparameterize_depthwise: false

  - name: efficient_hccr_multibranch_embed256_backbone320
    args:
      reparameterize_depthwise: true
      backbone_output_channels: 320
      embedding_dim: 256

  # Turns off both explicit projection knobs. With width=80, the native final
  # feature width and embedding dimension are both 320.
  - name: efficient_hccr_multibranch_native320
    args:
      reparameterize_depthwise: true

  - name: efficient_hccr_singlebranch_embed256_backbone320
    args:
      reparameterize_depthwise: false
      backbone_output_channels: 320
      embedding_dim: 256
