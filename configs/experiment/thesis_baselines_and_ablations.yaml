# Controlled full-class jobs for the four remaining thesis-table comparisons.
#
# The New EfficientHCCRNet run is intentionally omitted: retain the currently
# running full-class run as its canonical result rather than retraining it.
# The historical 96.33% checkpoint remains a separately reported legacy row.
#
# All jobs below inherit the New model's data, optimization, and profiling
# conditions. Each ablation changes exactly one proposed-model component.
experiment_id: thesis-baselines-and-ablations
manifest: data/processed/casia_hwdb/manifest.csv
output_dir: experiments
seeds: [7]
profile_devices: [cuda]
full_class_num_classes: 7186
# One torchrun process is launched for each of the two GPUs visible to nvidia-smi.
torchrun_nproc_per_node: 2

base_args:
  model: efficient_hccr
  device: cuda
  distributed: true
  dataset_backend: lmdb
  evaluation_policy: final_test
  reproducibility_mode: strict
  num_classes: 7186
  image_size: 96
  # Per GPU: 128 x 2 ranks preserves the New model's global batch of 256.
  batch_size: 128
  reference_batch_size: 256
  optimizer_step_policy: configured_epochs
  learning_rate_scaling: none
  epochs: 20
  learning_rate: 3.0e-4
  lr_warmup_ratio: 0.0
  weight_decay: 1.0e-4
  width: 80
  stage_depths: [2, 3, 3]
  stem_stride: 2
  backbone_output_channels: 320
  embedding_dim: 256
  reparameterize_depthwise: true
  classification_head: cosface
  logit_scale: 32.0
  angular_margin: 0.1
  margin_warmup_ratio: 0.2
  dropout: 0.1
  label_smoothing: 0.0
  scheduler: cosine
  scheduler_min_lr: 1.0e-6
  scheduler_patience: 3
  early_stopping_patience: 0
  num_workers: 16
  dataloader_start_method: auto
  prefetch_factor: 1
  persistent_workers: true
  worker_timeout_seconds: 120.0
  benchmark_warmup_iterations: 20
  benchmark_iterations: 200
  benchmark_repetitions: 5

variants:
  - name: resnet18
    args:
      model: resnet18
      classification_head: softmax

  - name: mobilenet_v3_small
    args:
      model: mobilenet_v3_small
      classification_head: softmax

  - name: efficient_hccr_without_reparameterization
    args:
      reparameterize_depthwise: false

  - name: efficient_hccr_without_cosface
    args:
      classification_head: softmax
