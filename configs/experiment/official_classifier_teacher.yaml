experiment_id: official-hwdb1_0-1_1-teacher
manifest: data/processed/hwdb1_0-1_1_official_five_splits/manifest.csv
output_dir: experiments/official_classifier
seeds: [7, 17, 29]
profile_devices: []
full_class_num_classes: 3755
base_args:
  model: efficient_hccr
  num_classes: 3755
  require_official_data: true
  evaluation_policy: validation_only
  checkpoint_selection: best_validation
  image_size: 96
  width: 80
  stage_depths: [2, 3, 3]
  backbone_output_channels: 320
  embedding_dim: 320
  reparameterize_depthwise: false
  classifier_structure: dense
  classification_head: cosface
  logit_scale: 32.0
