[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hccr"
version = "0.1.0"
description = "Offline handwritten Chinese character recognition."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["computer-vision", "deep-learning", "hccr", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "lmdb>=1.5",
  "matplotlib>=3.9",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "seaborn>=0.13",
  "torch>=2.6",
  "torchvision>=0.21",
  "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/Zephyrus000/hccr-deep-learning"
Issues = "https://github.com/Zephyrus000/hccr-deep-learning/issues"
Repository = "https://github.com/Zephyrus000/hccr-deep-learning"

[project.scripts]
hccr = "hccr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
